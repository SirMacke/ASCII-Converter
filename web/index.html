<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASCII Converter</title>
    <meta name="description" content="Turn images, GIFs and videos into ASCII art in your browser and export it as an image. Nothing is uploaded." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23111'/%3E%3Ctext x='8' y='12.5' font-family='monospace' font-size='12' font-weight='bold' fill='%23ddd' text-anchor='middle'%3E@%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>ASCII Converter</h1>
      <p>
        Drop, paste or open an image, GIF or video. Everything runs in your browser; nothing is uploaded.
        <a href="https://github.com/SirMacke/ASCII-Converter">Source and CLI</a> ·
        <a href="./JetBrainsMono-OFL.txt">Font licence</a>
      </p>
    </header>

    <main>
      <form id="controls" autocomplete="off">
        <section>
          <div class="row">
            <!-- Visually hidden rather than hidden, so it stays in the tab order. -->
            <input id="file" class="visually-hidden" type="file" accept="image/*,video/*" />
            <label class="button" for="file">Open file…</label>
            <select id="sample" aria-label="Load a sample">
              <option value="">Samples…</option>
              <option value="spheres">Spheres (PNG)</option>
              <option value="orbit">Orbit (animated GIF)</option>
            </select>
          </div>
          <div class="row" id="playback" hidden>
            <button type="button" id="play">Pause</button>
            <span id="frame-info" class="muted"></span>
          </div>
          <div class="row" role="group" aria-label="View">
            <span class="muted">View</span>
            <span class="segmented">
              <button type="button" data-view="ascii" aria-pressed="true">ASCII</button>
              <button type="button" data-view="compare" aria-pressed="false" title="Drag the divider to compare with the original">Compare</button>
              <button type="button" data-view="original" aria-pressed="false" aria-keyshortcuts="O" title="Show the original image (or hold O to peek)">Original</button>
            </span>
          </div>
          <p class="muted peek-hint">Hold <kbd>O</kbd> to peek at the original</p>
        </section>

        <section>
          <h2>Conversion</h2>
          <label class="field"><span>Width</span><input id="width" type="range" min="10" max="300" value="100" /><output id="width-value"></output></label>
          <label class="field">
            <span>Ramp</span>
            <select id="ramp">
              <option value="standard">standard</option>
              <option value="detailed">detailed</option>
              <option value="blocks">blocks</option>
              <option value="minimal">minimal</option>
              <option value="custom">custom…</option>
            </select>
          </label>
          <label class="field" id="custom-ramp-label" hidden>
            <span>Characters</span><input id="custom-ramp" type="text" value=" .oO@" spellcheck="false" title="Lightest first" />
          </label>
          <label class="field"><span>Brightness</span><input id="brightness" type="range" min="-1" max="1" step="0.05" value="0" /><output id="brightness-value"></output></label>
          <label class="field"><span>Contrast</span><input id="contrast" type="range" min="0" max="3" step="0.05" value="1" /><output id="contrast-value"></output></label>
          <label class="field"><span>Gamma</span><input id="gamma" type="range" min="0.2" max="3" step="0.05" value="1" /><output id="gamma-value"></output></label>
          <div class="checks">
            <label><input id="invert" type="checkbox" /> Invert</label>
            <label><input id="color" type="checkbox" checked /> Colour</label>
            <label><input id="dither" type="checkbox" /> Dither</label>
          </div>
        </section>

        <section>
          <h2>Look</h2>
          <label class="field">
            <span>Font</span>
            <select id="font">
              <option value="jetbrains">JetBrains Mono</option>
              <option value="system">System monospace</option>
              <option value="courier">Courier New</option>
            </select>
          </label>
          <div class="checks">
            <label><input id="bg" type="color" value="#0c0c0c" /> Background</label>
            <label><input id="fg" type="color" value="#d8d8d8" /> Text</label>
          </div>
        </section>

        <section>
          <h2>Export</h2>
          <div class="row">
            <select id="format" aria-label="Image format">
              <option value="png">PNG</option>
              <option value="jpeg">JPEG</option>
              <option value="webp">WebP</option>
            </select>
            <select id="size" aria-label="Image size">
              <option value="x1">1× screen</option>
              <option value="x2" selected>2× screen</option>
              <option value="x4">4× screen</option>
              <option value="512">512 px wide</option>
              <option value="1024">1024 px wide</option>
              <option value="2048">2048 px wide</option>
              <option value="4096">4096 px wide</option>
            </select>
          </div>
          <div class="row">
            <select id="square" aria-label="Shape">
              <option value="none">Original shape</option>
              <option value="pad">Square, padded</option>
              <option value="crop">Square, cropped</option>
            </select>
            <label class="inline"><input id="transparent" type="checkbox" /> Transparent</label>
          </div>
          <label class="field" id="quality-label" hidden><span>Quality</span><input id="quality" type="range" min="0.5" max="1" step="0.01" value="0.92" /><output id="quality-value"></output></label>
          <div class="row">
            <button type="button" id="export" class="primary">Download image</button>
            <span id="export-size" class="muted"></span>
          </div>
          <div class="row">
            <button type="button" id="record" hidden>Record WebM</button>
            <button type="button" id="copy">Copy text</button>
            <button type="button" id="download-txt">.txt</button>
            <button type="button" id="download-html">.html</button>
          </div>
        </section>

        <p id="info" class="muted"></p>
        <p id="status" role="status"></p>
      </form>

      <section id="stage" aria-label="Output">
        <div id="compare-box">
          <canvas id="preview" role="img" aria-label="ASCII art preview"></canvas>
          <!-- The original image, drawn in exactly the preview's box and revealed with a clip. Never exported. -->
          <canvas id="original" role="img" aria-label="Original image" hidden></canvas>
          <div id="divider" hidden>
            <div
              id="divider-handle"
              role="slider"
              tabindex="0"
              aria-label="Compare original and ASCII"
              aria-orientation="horizontal"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="50"
              aria-valuetext="50% original, 50% ASCII"
            ></div>
          </div>
        </div>
        <p id="drop-hint">Drop an image or video</p>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
